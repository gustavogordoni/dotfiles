source = ~/.config/omarchy/current/theme/hyprlock.conf

$font = CaskaydiaMono Nerd Font

general {
    hide_cursor = false
}

background {
    monitor =
    path = ~/.config/omarchy/current/background
    blur_passes = 2
    color = $color
}

label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 90
    font_family = $font
    position = 30, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B de %Y")"
    color = $font_color
    font_size = 25
    font_family = $font
    position = 30, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 400, 75
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color
    check_color = $check_color
    fail_color = $fail_color
    capslock_color = $caps_color

    fade_on_empty = false
    hide_input = false

    placeholder_text = <span foreground="##DCD2F0">󰌾  Autenticado como <span foreground="##b4aadce6">$USER</span></span>
    fail_text = <i>Tentativas: <b>$ATTEMPTS</b></i>

    position = 0, -95
    halign = center
    valign = center
}

auth {
    fingerprint:enabled = true
}


label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/songdetail.sh)" 
    color = $outer_color
    font_size = 18
    font_family = JetBrains Mono Nerd
    position = 0, 25
    halign = center
    valign = bottom
}