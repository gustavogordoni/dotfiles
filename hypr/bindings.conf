# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
unbind = SUPER, F
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, $terminal -e lazydocker
# bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
# bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
# bindd = SUPER SHIFT, slash, Passwords, exec, uwsm app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
# bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
# bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
# bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT, W, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
# bindd = SUPER CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
# bindd = SUPER , X, X, exec, omarchy-launch-webapp "https://x.com/"
# bindd = SUPER SHIFT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER SHIFT, SPACE
# bindd = SUPER SHIFT, SPACE, Omarchy menu, exec, omarchy-menu

# ===============
# CUSTOM
# ===============

# Fullscreen
unbind = SUPER SHIFT, F
bind = SUPER SHIFT, F, fullscreen, 0

# Btop
unbind = SUPER, T
bindd = SUPER, T, Activity, exec, $terminal -e btop

# Toggle Floating
unbind = SUPER, V
bindd = SUPER, V, Toggle window floating/tiling, togglefloating,

# Discord
bindd = SUPER, D, Discord, exec, omarchy-launch-webapp "https://discord.com/channels/@me"

# Github
unbind = SUPER, G
bindd = SUPER, G, Github, exec, omarchy-launch-webapp "https://github.com/gustavogordoni?tab=repositories"

# Netbeans
bindd = SUPER SHIFT, N, Netbeans, exec, netbeans

# Calculator
bindd = SUPER SHIFT, C, Calculator, exec, gnome-calculator

# Toogle Monitor Config
# bindd = SUPER SHIFT, M, Monitor, exec, hyprmon --profile Work
# bindd = SUPER SHIFT ALT, M, Monitor, exec, hyprmon --profile Mirror
bind = SUPER SHIFT, M, exec, ~/.config/hypr/scripts/hyprmon-picker.sh

# Toggle Waybar Theme
bindd = SUPER, Z, Waybar, exec, omarchy-theme-waybar
# Toggle Waybar Theme (Test) - IGNORE
bindd = SUPER SHIFT, Z, Waybar, exec, omarchy-theme-waybar test